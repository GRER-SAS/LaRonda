<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de Caja | GRER S.A.S.</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0;padding:24px 16px}.wrap{max-width:1200px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.head h1{margin:0}.head a{color:#172033;font-weight:700;text-decoration:none}.filters,.cards,.table{background:#fff;border:1px solid #e4e8ef;border-radius:16px;padding:18px;margin-bottom:16px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}select{width:100%;padding:10px;border:1px solid #cfd6e2;border-radius:9px;background:white}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.card{background:#f7f8fb;padding:13px;border-radius:11px}.card span{font-size:11px;color:#667085}.card strong{display:block;font-size:18px;margin-top:5px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #edf0f4;white-space:nowrap}th{font-size:11px;text-transform:uppercase;color:#667085}.ok{font-weight:800}.empty{text-align:center;padding:35px;color:#667085}@media(max-width:800px){.filters,.cards{grid-template-columns:1fr 1fr}.head{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.filters,.cards{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="head"><div><h1>GRER S.A.S.</h1><div>Panel administrativo · Cierres de caja</div></div><a href="?">← Volver al cierre</a></header><section class="filters"><div><label>HOTEL</label><select id="hotel"><option>Todos</option></select></div><div><label>FECHA</label><select id="fecha"><option>Todas</option></select></div><div><label>TURNO</label><select id="turno"><option>Todos</option></select></div></section><section class="cards"><div class="card"><span>CIERRES</span><strong id="cierres">0</strong></div><div class="card"><span>CIERRES CORRECTOS</span><strong id="correctos">0</strong></div><div class="card"><span>INGRESOS TOTALES</span><strong id="ingresos">$0.00</strong></div><div class="card"><span>EFECTIVO</span><strong id="efectivo">$0.00</strong></div><div class="card"><span>TRANSFERENCIAS</span><strong id="transferencias">$0.00</strong></div><div class="card"><span>TARJETAS</span><strong id="tarjetas">$0.00</strong></div></section><section class="table"><div class="scroll"><table><thead><tr><th>Fecha</th><th>Hora</th><th>Hotel</th><th>Turno</th><th>Recepcionista</th><th>Esperado</th><th>Contado</th><th>Diferencia</th><th>Egresos</th><th>Estado</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty hidden">No existen cierres con estos filtros.</div></section></div><script>const $=id=>document.getElementById(id);const money=v=>'$'+Number(v||0).toFixed(2);function load(){google.script.run.withSuccessHandler(render).withFailureHandler(e=>alert(e.message||'Error')).getDashboardData({hotel:$('hotel').value,fecha:$('fecha').value,turno:$('turno').value})}function render(d){$('cierres').textContent=d.summary.cierres;$('correctos').textContent=d.summary.cierresCorrectos;$('ingresos').textContent=money(d.summary.totalIngresos);$('efectivo').textContent=money(d.summary.totalEfectivo);$('transferencias').textContent=money(d.summary.totalTransferencias);$('tarjetas').textContent=money(d.summary.totalTarjetas);const tbody=$('rows');tbody.innerHTML=d.rows.map(r=>`<tr><td>${r.fecha}</td><td>${r.hora}</td><td>${r.hotel}</td><td>${r.turno}</td><td>${r.recepcionista}</td><td>${money(r.esperado)}</td><td>${money(r.cajaContada)}</td><td>${money(r.diferencia)}</td><td>${money(r.egresos)}</td><td class="ok">${r.estado}</td></tr>`).join('');$('empty').className=d.rows.length?'empty hidden':'empty'}google.script.run.withSuccessHandler(d=>{d.hotels.forEach(h=>$('hotel').insertAdjacentHTML('beforeend',`<option>${h}</option>`));d.shifts.forEach(s=>$('turno').insertAdjacentHTML('beforeend',`<option>${s}</option>`));const dates=[...new Set(d.rows.map(r=>r.fecha))];dates.forEach(x=>$('fecha').insertAdjacentHTML('beforeend',`<option>${x}</option>`));load()}).getDashboardData({});['hotel','fecha','turno'].forEach(id=>$(id).addEventListener('change',load));</script></body></html>
